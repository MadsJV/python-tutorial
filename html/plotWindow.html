<div class="plotWindowHeader">
    <span>Plot output</span>
    <div class="plotWindowActions">
        <button type="button" class="plotWindowButton" title="Open plot in new tab" onclick="openPlotInNewTab()">↗</button>
        <button type="button" class="plotWindowButton" title="Close plot" onclick="closePlotWindow()">×</button>
    </div>
</div>
<div class="plotWindowBody">
    <img class="plotWindowImage" alt="Python plot output">
</div>
