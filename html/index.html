<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Tutorial</title>
    <link rel="stylesheet" href="../css/root.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/textContainers.css">
    <link rel="stylesheet" href="../css/editorWidget.css">
    <link rel="stylesheet" href="../css/exams.css">
    <link rel="icon" type="image/png" href="../images/icons/pythonLogo.png?v=2">
</head>
<body>
    <div class="sidebarContainer">
        <nav class="sidebar">
            <div class="sideBarHeader">
                <div class="navigationCurrentItemIndicator"></div>
                <img class="chapterList headerNavigationItem" src="../images/icons/book.svg" alt="Chapter List" title="Chapter List"/>
                <img class="settings headerNavigationItem" src="../images/icons/settings.svg" alt="Settings" title="Settings"/>
            </div>
            <div class="sidebarChapterList"></div>
        </nav>
        <img class="sidebarChevron" src="../images/icons/chevronForwards.svg"/>
    </div>
    <div class="mainContainer">
        <div class="titleContainer">
            <div class="title">Python</div>
            <img class="pythonLogoTitle" src="../images/pictures/pythonLogo.svg" alt="Python Logo">
        </div>
        <div class="mainContentContainer"></div>
        <div class="examSelectorContainer">
            <div class="examSelectorWrapper">
                <div class="examSelectorIconWrapper">
                    <img class="examSelectorIcon" src="../images/icons/documentSearch.svg">
                </div>
                <button class="confirmButtonExamSelector" onClick="renderExamTask('r2-v2025-exam')">test</button>
                <input class="examSelectorUserInterface" placeholder="Velg en eksam" list="selectableExams"/>
                <datalist id="selectableExams">
                    <option value="R2 V2025 Eksamen"></option>
                    <option value="R1 V2025 Eksamen"></option>
                    <option value="1T V2025 Tentamen"></option>
                    <option value="R2 H2025 Eksamen"></option>
                </datalist>
            </div>
            <div class="wrapperFlexGrowAnimationHelper"></div>
        </div>
        <div class="examContentContainer" id="examContentContainer">
        </div>
        <div style="height: 10vh"></div>
    </div>
    <script src="../javaScript/populateEditorContainer.js"></script>
    <script src="../javaScript/constructTextContent.js"></script>
    <script src="../javaScript/fetchTheme.js"></script>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
    <script src="../javaScript/appConfig.js"></script>
    <script src="../javaScript/appState.js"></script>
    <script src="../javaScript/fetchUtils.js"></script>
    <script src="../javaScript/plotWindow.js"></script>
    <!-- <script src="../javaScript/inputWindow.js"></script> -->
    <script src="../javaScript/pyodideRuntime.js"></script>
    <script src="../javaScript/editorRuntime.js"></script>
    <script src="../javaScript/codeDisplay.js"></script>
    <script src="../javaScript/constructExamTask.js"></script>
    <script src="../javaScript/startup.js"></script>
</body>
</html>
