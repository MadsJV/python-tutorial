<div class="inputWindowHeader">
    <span>Input</span>
    <div class="inputWindowActions">
        <button type="button" class="inputWindowButton" title="Close input" onclick="closeInputWindow()">×</button>
    </div>
</div>
<div class="inputWindowBody">
    <div class="inputWindowPrompt"></div>
    <div class="inputWindowInputContainer">
        <input type="text" class="inputWindowInput" placeholder="Enter input..." autocomplete="off">
        <button type="button" class="inputWindowSubmit" onclick="submitInput()">Submit</button>
    </div>
</div>
